<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 - HTML5 Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">Assignment #4</a>
      <div class="navbar-nav flex-row flex-wrap gap-3">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="task0.html">Task 0</a>
        <a class="nav-link active" aria-current="page" href="task1.html">Task 1</a>
        <a class="nav-link" href="task2.html">Task 2</a>
        <a class="nav-link" href="task3.html">Task 3</a>
        <a class="nav-link" href="task4.html">Task 4</a>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <h1>Task 1: HTML5 Validation</h1>
    <form class="contact-form mt-4">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input id="name" name="name" class="form-control" required maxlength="50">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" name="email" type="email" class="form-control" required maxlength="100">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message" class="form-control" rows="4" required maxlength="500"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
      <div class="alert alert-success mt-3 success-message" role="status" hidden>Form submitted successfully.</div>
    </form>
  </main>
</body>
</html>
