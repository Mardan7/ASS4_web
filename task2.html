<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Bootstrap Form Styling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">Assignment #4</a>
      <div class="navbar-nav flex-row flex-wrap gap-3">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="task0.html">Task 0</a>
        <a class="nav-link" href="task1.html">Task 1</a>
        <a class="nav-link active" aria-current="page" href="task2.html">Task 2</a>
        <a class="nav-link" href="task3.html">Task 3</a>
        <a class="nav-link" href="task4.html">Task 4</a>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <h1>Task 2: Bootstrap Form Styling</h1>
    <form class="contact-form mt-4">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="name" class="form-label">Name</label>
          <input id="name" name="name" type="text" class="form-control" placeholder="Your name" autocomplete="name" required maxlength="50" aria-describedby="nameHelp">
          <div id="nameHelp" class="form-text">Enter your full name (up to 50 characters).</div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" placeholder="name@example.com" autocomplete="email" required maxlength="100" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">Enter a valid email address.</div>
        </div>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message" class="form-control" rows="4" placeholder="Write your message" required maxlength="500" aria-describedby="messageHelp"></textarea>
        <div id="messageHelp" class="form-text">Maximum 500 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </main>
</body>
</html>
